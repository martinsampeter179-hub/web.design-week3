<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Personal Budget Tracker</title>
  
  <!-- 1. Custom Google Fonts Import (Poppins & Inter) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@600;700&display=swap" rel="stylesheet">
  
  <!-- 2. Stylesheet -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="app-container">
    
    <!-- Card 1: Page Header -->
    <header class="card header-card">
      <h1>Budget Tracker</h1>
      <p class="subtitle">Monitor and control your personal finances seamlessly.</p>
    </header>

    <!-- Card 2: Add Expense Form -->
    <section class="card form-card">
      <h2>Add New Expense</h2>
      <form class="expense-form">
        <div class="form-group">
          <label for="description">Description</label>
          <input type="text" id="description" placeholder="e.g., Groceries" required>
        </div>

        <div class="form-group">
          <label for="amount">Amount ($)</label>
          <input type="number" id="amount" placeholder="e.g., 45.00" step="0.01" required>
        </div>

        <div class="form-group">
          <label for="category">Category</label>
          <select id="category" required>
            <option value="" disabled selected>Select Category</option>
            <option value="Food">Food</option>
            <option value="Utilities">Utilities</option>
            <option value="Entertainment">Entertainment</option>
            <option value="Transport">Transport</option>
          </select>
        </div>

        <div class="form-group">
          <label for="date">Date</label>
          <input type="date" id="date" required>
        </div>

        <button type="submit" class="btn-primary">Add Expense</button>
      </form>
    </section>

    <!-- Card 3: Expense Table -->
    <section class="card table-card">
      <h2>Recent Expenses</h2>
      <div class="table-wrapper">
        <table class="expense-table">
          <thead>
            <tr>
              <th>Description</th>
              <th>Category</th>
              <th>Date</th>
              <th>Amount</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td>Weekly Grocery Shopping</td>
              <td><span class="badge food">Food</span></td>
              <td>2026-09-20</td>
              <td class="amount">$120.50</td>
            </tr>
            <tr>
              <td>Electricity Bill</td>
              <td><span class="badge utilities">Utilities</span></td>
              <td>2026-09-22</td>
              <td class="amount">$65.00</td>
            </tr>
            <tr>
              <td>Movie Night Out</td>
              <td><span class="badge entertainment">Entertainment</span></td>
              <td>2026-09-24</td>
              <td class="amount">$30.00</td>
            </tr>
          </tbody>
        </table>
      </div>
    </section>

  </main>

</body>
</html>
